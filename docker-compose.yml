version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: leaseguard-db
    environment:
      POSTGRES_USER: leaseguard
      POSTGRES_PASSWORD: leaseguard_secret
      POSTGRES_DB: leaseguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaseguard -d leaseguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
