<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="carpet_out" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#faf5ec"/>
      <stop offset="100%" stop-color="#e3dac9"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#carpet_out)"/>
  
  <!-- Subtle natural traffic shading -->
  <ellipse cx="200" cy="140" rx="90" ry="25" fill="#cfc2ac" opacity="0.4"/>

  <!-- Move-Out Status Stamp -->
  <rect x="15" y="15" width="185" height="26" rx="4" fill="#dc2626" fill-opacity="0.9"/>
  <text x="107" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">MOVE-OUT CLAIM ($450 DOCKED)</text>

  <!-- Legal Callout Bubble -->
  <rect x="25" y="195" width="350" height="75" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="35" y="215" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d97706">STATUTORY CLASSIFICATION: NORMAL WEAR &amp; TEAR</text>
  <text x="35" y="232" font-family="Arial, sans-serif" font-size="10" fill="#334155">Normal walking traffic shading; no burns, pet stains, or rips.</text>
  <text x="35" y="247" font-family="Arial, sans-serif" font-size="10" fill="#334155">Landlord's automatic $450 turnover cleaning fee is void under § 44-7-33.</text>
</svg>
